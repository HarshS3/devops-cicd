name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Code Verification & Automated Testing
  # -------------------------------------------------------------
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

  # -------------------------------------------------------------
  # STAGE 2: Docker Build & Push to Docker Hub
  # -------------------------------------------------------------
  build-and-push:
    name: 🐳 Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:sha-${{ github.sha }}

  # -------------------------------------------------------------
  # STAGE 3: Pull & Verify Deployed Docker Container
  # -------------------------------------------------------------
  verify-container:
    name: 🚀 Verify Docker Container
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull Image from Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:latest

      - name: Run Container Locally
        run: |
          docker run -d --name test-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:latest
          sleep 5

      - name: Verify Container Health Endpoint
        run: |
          curl --fail http://localhost:8080/health || exit 1
          echo "Docker container is running and healthy!"
          docker logs test-app
