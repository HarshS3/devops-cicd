name: Cloud-Native CI/CD Pipeline (Docker & Kubernetes)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

jobs:
  # =============================================================
  # STAGE 1: Code Verification & Automated Testing
  # =============================================================
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

  # =============================================================
  # STAGE 2: Docker Build & Push to Docker Hub
  # =============================================================
  build-and-push:
    name: 🐳 Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:${{ github.event.inputs.tag || 'latest' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:sha-${{ github.sha }}

  # =============================================================
  # STAGE 3: Continuous Deployment (CD) to Kubernetes
  # =============================================================
  deploy-to-kubernetes:
    name: ☸️ Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Spin up Kubernetes Cluster (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: cicd-k8s-cluster

      - name: Deploy Kubernetes Manifests
        run: |
          echo "Updating deployment with image: ${{ secrets.DOCKERHUB_USERNAME }}/simple-cloud-app:${{ github.event.inputs.tag || 'latest' }}"
          sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Kubernetes Deployment & Pods
        run: |
          echo "Checking rolling update status..."
          kubectl rollout status deployment/cloud-native-app --timeout=120s
          echo "=== KUBERNETES PODS ==="
          kubectl get pods -o wide
          echo "=== KUBERNETES SERVICES ==="
          kubectl get services -o wide
